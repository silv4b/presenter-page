<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/presenter-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Presenter: apresente PDFs como slides profissionais no desktop. Janela de controle para o apresentador, projeção em tela cheia, anotações ao vivo e cronômetro. Gratuito e open source." />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <title>Presenter - Transforme PDFs em apresentações</title>
    <script>
        (function () {
            try {
                var t = localStorage.getItem("presenter-theme");
                if (t !== "light" && t !== "dark") t = "dark";
                var root = document.documentElement;
                root.setAttribute("data-theme", t);
                root.style.colorScheme = t;
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute("content", t === "light" ? "#f6f6f7" : "#0a0a0a");
            } catch (e) {
                document.documentElement.setAttribute("data-theme", "dark");
            }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
